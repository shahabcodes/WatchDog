name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-number-based app version; the Gradle convention plugin reads these.
      APP_VERSION_NAME: 0.1.${{ github.run_number }}
      APP_VERSION_CODE: ${{ github.run_number }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision google-services.json
        env:
          PARENT_B64: ${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}
          CHILD_B64: ${{ secrets.GOOGLE_SERVICES_CHILD_B64 }}
        run: |
          set -euo pipefail
          # Use real credentials from repo secrets when present, otherwise fall
          # back to the committed placeholders so an APK can still be produced.
          if [ -n "${PARENT_B64:-}" ]; then
            echo "$PARENT_B64" | base64 -d > parent-app/google-services.json
            echo "parent: using google-services.json from secret."
          else
            cp ci/google-services-placeholder.parent.json parent-app/google-services.json
            echo "parent: using committed placeholder."
          fi
          if [ -n "${CHILD_B64:-}" ]; then
            echo "$CHILD_B64" | base64 -d > child-app/google-services.json
            echo "child: using google-services.json from secret."
          else
            cp ci/google-services-placeholder.child.json child-app/google-services.json
            echo "child: using committed placeholder."
          fi

      - name: Build debug APKs
        run: gradle :parent-app:assembleDebug :child-app:assembleDebug --no-daemon --stacktrace

      - name: Upload parent-app APK
        uses: actions/upload-artifact@v4
        with:
          name: parent-app-debug
          path: parent-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload child-app APK
        uses: actions/upload-artifact@v4
        with:
          name: child-app-debug
          path: child-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ----- Releases (so the APKs show up under the repo's Releases tab) -----
      - name: Collect APKs for release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp parent-app/build/outputs/apk/debug/*.apk "dist/watchdog-parent-v${APP_VERSION_NAME}.apk"
          cp child-app/build/outputs/apk/debug/*.apk  "dist/shield-child-v${APP_VERSION_NAME}.apk"

      - name: Reset "latest" release so its date reflects this build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish rolling "latest" pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: v${{ env.APP_VERSION_NAME }} (latest)
          prerelease: true
          body: >
            Debug APKs from the latest `main` build — version ${{ env.APP_VERSION_NAME }}
            (build ${{ github.run_number }}).
          files: dist/*.apk

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
