name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision google-services.json
        env:
          PARENT_B64: ${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}
          CHILD_B64: ${{ secrets.GOOGLE_SERVICES_CHILD_B64 }}
        run: |
          set -euo pipefail
          # Use real credentials from repo secrets when present, otherwise fall
          # back to the committed placeholders so an APK can still be produced.
          if [ -n "${PARENT_B64:-}" ]; then
            echo "$PARENT_B64" | base64 -d > parent-app/google-services.json
            echo "parent: using google-services.json from secret."
          else
            cp ci/google-services-placeholder.parent.json parent-app/google-services.json
            echo "parent: using committed placeholder."
          fi
          if [ -n "${CHILD_B64:-}" ]; then
            echo "$CHILD_B64" | base64 -d > child-app/google-services.json
            echo "child: using google-services.json from secret."
          else
            cp ci/google-services-placeholder.child.json child-app/google-services.json
            echo "child: using committed placeholder."
          fi

      - name: Build debug APKs
        run: gradle :parent-app:assembleDebug :child-app:assembleDebug --no-daemon --stacktrace

      - name: Upload parent-app APK
        uses: actions/upload-artifact@v4
        with:
          name: parent-app-debug
          path: parent-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload child-app APK
        uses: actions/upload-artifact@v4
        with:
          name: child-app-debug
          path: child-app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # ----- Releases (so the APKs show up under the repo's Releases tab) -----
      - name: Collect APKs for release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp parent-app/build/outputs/apk/debug/*.apk dist/watchdog-parent-debug.apk
          cp child-app/build/outputs/apk/debug/*.apk  dist/watchdog-child-debug.apk

      - name: Publish rolling "latest" pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (main)
          prerelease: true
          body: >
            Automatically updated debug APKs from the latest `main` build.
            Built against placeholder Firebase config.
          files: dist/*.apk

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*.apk
