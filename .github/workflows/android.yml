name: Android CI

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Build-number-based app version; the Gradle convention plugin reads these.
      APP_VERSION_NAME: 0.1.${{ github.run_number }}
      APP_VERSION_CODE: ${{ github.run_number }}
      # Google Maps key (empty if the secret isn't set — map tiles just won't load).
      MAPS_API_KEY: ${{ secrets.MAPS_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Provision google-services.json
        env:
          PARENT_B64: ${{ secrets.GOOGLE_SERVICES_PARENT_B64 }}
          CHILD_B64: ${{ secrets.GOOGLE_SERVICES_CHILD_B64 }}
        run: |
          set -euo pipefail
          # Use real credentials from repo secrets when present, otherwise fall
          # back to the committed placeholders so an APK can still be produced.
          if [ -n "${PARENT_B64:-}" ]; then
            echo "$PARENT_B64" | base64 -d > parent-app/google-services.json
            echo "parent: using google-services.json from secret."
          else
            cp ci/google-services-placeholder.parent.json parent-app/google-services.json
            echo "parent: using committed placeholder."
          fi
          if [ -n "${CHILD_B64:-}" ]; then
            echo "$CHILD_B64" | base64 -d > child-app/google-services.json
            echo "child: using google-services.json from secret."
          else
            cp ci/google-services-placeholder.child.json child-app/google-services.json
            echo "child: using committed placeholder."
          fi

      - name: Build debug APKs
        run: gradle :parent-app:assembleDebug :child-app:assembleDebug --no-daemon --stacktrace

      # Release signing (key rotation). Gradle signs with the public shared debug
      # key; here the APKs are re-signed so Android 9+ sees the PRIVATE release
      # key, vouched for by the old key in keystore/signing-lineage.bin — phones
      # update normally, and an update signed only with the public key is refused.
      # Android 8 (minSdk 26) still checks the old key. The release keystore and
      # its password live only in repo secrets.
      - name: Sign APKs with the release key (rotation)
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_B64 }}
          RELEASE_KEYSTORE_PASSWORD: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          IS_RELEASE: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' }}
        run: |
          set -euo pipefail
          if [ ! -f keystore/signing-lineage.bin ]; then
            echo "No signing lineage committed; APKs stay signed with the shared debug key."
            exit 0
          fi
          if [ -z "${RELEASE_KEYSTORE_B64:-}" ] || [ -z "${RELEASE_KEYSTORE_PASSWORD:-}" ]; then
            if [ "$IS_RELEASE" = "true" ]; then
              echo "::error::Release key secrets are missing. Phones already on the release key can't install a debug-key-only build, so this release is stopped."
              exit 1
            fi
            echo "Release key secrets unavailable (e.g. a pull request); skipping release signing."
            exit 0
          fi
          echo "$RELEASE_KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          trap 'rm -f "$RUNNER_TEMP/release.p12"' EXIT
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          for apk in parent-app/build/outputs/apk/debug/*.apk child-app/build/outputs/apk/debug/*.apk; do
            "$BT/apksigner" sign               --ks keystore/debug.keystore --ks-pass pass:android --ks-key-alias androiddebugkey               --next-signer --ks "$RUNNER_TEMP/release.p12" --ks-pass env:RELEASE_KEYSTORE_PASSWORD --ks-key-alias watchdog               --lineage keystore/signing-lineage.bin --rotation-min-sdk-version 28               --out "$apk.signed" "$apk"
            mv "$apk.signed" "$apk"
            echo "$(basename "$apk") on Android 9+: $("$BT/apksigner" verify --min-sdk-version 28 --print-certs "$apk" | grep -m1 'SHA-256')"
          done

      # APKs are delivered via Releases (below), not Actions artifacts — avoids
      # the Actions artifact storage quota.

      # ----- Releases (so the APKs show up under the repo's Releases tab) -----
      - name: Collect APKs for release
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          mkdir -p dist
          cp parent-app/build/outputs/apk/debug/*.apk "dist/watchdog-parent-v${APP_VERSION_NAME}.apk"
          cp child-app/build/outputs/apk/debug/*.apk  "dist/shield-child-v${APP_VERSION_NAME}.apk"

      - name: Reset "latest" release so its date reflects this build
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete latest --repo "${{ github.repository }}" --yes --cleanup-tag || true

      - name: Publish rolling "latest" pre-release
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: v${{ env.APP_VERSION_NAME }} (latest)
          prerelease: true
          body: >
            Debug APKs from the latest `main` build — version ${{ env.APP_VERSION_NAME }}
            (build ${{ github.run_number }}). Full history: see the Releases list and
            [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md).
          files: dist/*.apk

      # Only the rolling "latest" release keeps APKs. Delete every other release
      # (and its tag) each build so old APKs don't pile up in git storage. The
      # textual history still lives in CHANGELOG.md and the git log.
      - name: Prune old release APKs to save storage
        if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tags=$(gh release list --repo "${{ github.repository }}" --limit 300 --json tagName -q '.[].tagName' || true)
          for tag in $tags; do
            if [ "$tag" != "latest" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --repo "${{ github.repository }}" --yes --cleanup-tag || true
            fi
          done
